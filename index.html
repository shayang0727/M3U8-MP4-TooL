<body>
<div class="container">
  <h1>M3U8 → MP4 转换器</h1>
  <p class="subtitle">纯浏览器本地转换，无需上传服务器，保护隐私</p>

  <div class="input-group">
    <input type="text" id="urlInput" placeholder="粘贴 m3u8 视频链接，例如 https://example.com/video/index.m3u8">

  </div>

  <div class="divider">或</div>

  <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
    <div class="upload-icon">📁</div>
    <div class="upload-text">点击选择或拖拽 <span>.m3u8 文件</span> 到此处</div>
    <input type="file" id="fileInput" accept=".m3u8,.txt">
  </div>

  <div class="status-card" id="statusCard">
    <div class="status-row">
      <span class="status-label">当前状态</span>

      <span class="status-label">分段数量</span>
      <span class="status-value" id="segmentCount">0 / 0</span>

    <div class="status-row">
      <span class="status-label">已下载大小</span>

<script src="https://cdn.jsdelivr.net/npm/mux.js@6.3.0/dist/mux.min.js"></script>
<script>
let segments = [];
let downloadedSegments = [];
let totalSize = 0;
let startTime = 0;
let timerInterval = null;
let mp4Blob = null;
let mp4Url = null;
let isConverting = false;

const logArea = document.getElementById('logArea');
const statusCard = document.getElementById('statusCard');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const currentStatus = document.getElementById('currentStatus');
const segmentCountEl = document.getElementById('segmentCount');
const downloadedSizeEl = document.getElementById('downloadedSize');
const elapsedTimeEl = document.getElementById('elapsedTime');
const downloadBtn = document.getElementById('downloadBtn');
const clearBtn = document.getElementById('clearBtn');
const startBtn = document.getElementById('startBtn');
const urlInput = document.getElementById('urlInput');
const fileInput = document.getElementById('fileInput');
const uploadArea = document.getElementById('uploadArea');
const previewSection = document.getElementById('previewSection');
const previewVideo = document.getElementById('previewVideo');
const videoSize = document.getElementById('videoSize');
const videoDuration = document.getElementById('videoDuration');
const videoResolution = document.getElementById('videoResolution');

uploadArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadArea.classList.add('dragover');
});
uploadArea.addEventListener('dragleave', () => {
  uploadArea.classList.remove('dragover');
});
uploadArea.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

fileInput.addEventListener('change', (e) => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

function log(msg, type = 'info') {
  const line = document.createElement('div');
  line.className = 'log-' + type;
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  line.textContent = `[${time}] ${msg}`;
  logArea.appendChild(line);
  logArea.scrollTop = logArea.scrollHeight;
}

function setStatus(text) {
  currentStatus.textContent = text;
}

function updateProgress(percent) {
  progressFill.style.width = percent + '%';
  progressText.textContent = percent.toFixed(1) + '%';
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60).toString().padStart(2, '0');
  const s = Math.floor(seconds % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function startTimer() {
  startTime = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = (Date.now() - startTime) / 1000;
    elapsedTimeEl.textContent = formatTime(elapsed);
  }, 1000);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function parseM3U8(content, baseUrl) {
  const lines = content.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  const result = [];
  
  for (const line of lines) {
    if (line.match(/\.(ts|aac|mp4|m4s)(\?|$)/i) || line.includes('.ts?')) {
      if (line.endsWith('.m3u8') || line.includes('.m3u8?')) continue;
      
      let url = line;
      if (!url.startsWith('http') && !url.startsWith('data:') && baseUrl) {
        if (url.startsWith('/')) {
          const urlObj = new URL(baseUrl);
          url = urlObj.origin + url;
        } else {
          url = baseUrl.substring(0, baseUrl.lastIndexOf('/') + 1) + url;
        }
      }
      result.push(url);
    }
  }
  return result;
}

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const content = e.target.result;
    segments = parseM3U8(content, null);
    
    if (segments.length === 0) {
      const lines = content.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
      if (lines.length > 0 && lines[0].startsWith('http')) {
        segments = lines;
      }
    }
    
    if (segments.length === 0) {
      log('未在文件中找到视频分段地址', 'error');
      return;
    }
    
    log(`解析到 ${segments.length} 个视频分段`, 'success');
    statusCard.classList.add('active');
    clearBtn.classList.add('show');
    setStatus('已解析，点击开始转换');
    segmentCountEl.textContent = `0 / ${segments.length}`;
  };
  reader.readAsText(file);
}

// ========== MP4 Box 解析与时长修正 ==========

// 读取 32 位无符号整数
function readUint32(data, offset) {
  return (data[offset] << 24) | (data[offset + 1] << 16) | (data[offset + 2] << 8) | data[offset + 3];
}

// 写入 32 位无符号整数
function writeUint32(data, offset, value) {
  data[offset] = (value >>> 24) & 0xff;
  data[offset + 1] = (value >>> 16) & 0xff;
  data[offset + 2] = (value >>> 8) & 0xff;
  data[offset + 3] = value & 0xff;
}

// 读取 64 位无符号整数
function readUint64(data, offset) {
  const high = readUint32(data, offset);
  const low = readUint32(data, offset + 4);
  return high * 0x100000000 + low;
}

// 写入 64 位无符号整数
function writeUint64(data, offset, value) {
  const high = Math.floor(value / 0x100000000);
  const low = value % 0x100000000;
  writeUint32(data, offset, high);
  writeUint32(data, offset + 4, low);
}

// 查找 box
function findBox(data, start, end, boxName) {
  let offset = start;
  while (offset < end) {
    if (offset + 8 > end) break;
    let size = readUint32(data, offset);
    const type = String.fromCharCode(data[offset + 4], data[offset + 5], data[offset + 6], data[offset + 7]);
    
    if (size === 0) break;
    if (size === 1) {
      // 64-bit size
      size = readUint64(data, offset + 8);
      if (type === boxName) return { offset, size, headerSize: 16 };
      offset += size;
    } else {
      if (type === boxName) return { offset, size, headerSize: 8 };
      offset += size;
    }
  }
  return null;
}

// 从 moof/traf/trun 中计算片段时长
function getFragmentDuration(data, start, end, timescale) {
  const moof = findBox(data, start, end, 'moof');
  if (!moof) return 0;
  
  const moofEnd = moof.offset + moof.size;
  let offset = moof.offset + moof.headerSize;
  
  let maxEndTime = 0;
  
  // 遍历 moof 中的所有 traf
  while (offset < moofEnd) {
    if (offset + 8 > moofEnd) break;
    let size = readUint32(data, offset);
    const type = String.fromCharCode(data[offset + 4], data[offset + 5], data[offset + 6], data[offset + 7]);
    
    if (size <= 0) break;
    
    if (type === 'traf') {
      const trafEnd = offset + size;
      
      // 找 tfhd（默认样本时长）
      let defaultSampleDuration = 0;
      const tfhd = findBox(data, offset + 8, trafEnd, 'tfhd');
      if (tfhd) {
        const tfhdDataOffset = tfhd.offset + tfhd.headerSize;
        const version = data[tfhdDataOffset];
        const flags = (data[tfhdDataOffset + 1] << 16) | (data[tfhdDataOffset + 2] << 8) | data[tfhdDataOffset + 3];
        
        let fieldOffset = tfhdDataOffset + 4;
        // track_ID (4 bytes)
        fieldOffset += 4;
        // base-data-offset (8 bytes) - flag 0x000001
        if (flags & 0x000001) fieldOffset += 8;
        // sample-description-index (2 bytes) - flag 0x000002
        if (flags & 0x000002) fieldOffset += 2;
        // default-sample-duration (4 bytes) - flag 0x000008
        if (flags & 0x000008) {
          defaultSampleDuration = readUint32(data, fieldOffset);
        }
      }
      
      // 找 tfdt（解码时间）
      let baseTime = 0;
      const tfdt = findBox(data, offset + 8, trafEnd, 'tfdt');
      if (tfdt) {
        const tfdtDataOffset = tfdt.offset + tfdt.headerSize;
        const version = data[tfdtDataOffset];
        if (version === 1) {
          baseTime = readUint64(data, tfdtDataOffset + 4);
        } else {
          baseTime = readUint32(data, tfdtDataOffset + 4);
        }
      }
      
      // 找 trun（样本时长）
      const trun = findBox(data, offset + 8, trafEnd, 'trun');
      if (trun) {
        const trunDataOffset = trun.offset + trun.headerSize;
        const version = data[trunDataOffset];
        const flags = (data[trunDataOffset + 1] << 16) | (data[trunDataOffset + 2] << 8) | data[trunDataOffset + 3];
        const sampleCount = readUint32(data, trunDataOffset + 4);
        
        let sampleOffset = trunDataOffset + 8;
        // data-offset (4 bytes) - flag 0x000001
        if (flags & 0x000001) sampleOffset += 4;
        // first-sample-flags (4 bytes) - flag 0x000004
        if (flags & 0x000004) sampleOffset += 4;
        
        let totalDuration = 0;
        for (let i = 0; i < sampleCount; i++) {
          let sampleDuration = defaultSampleDuration;
          // sample-duration (4 bytes) - flag 0x000100
          if (flags & 0x000100) {
            sampleDuration = readUint32(data, sampleOffset);
            sampleOffset += 4;
          }
          // sample-size (4 bytes) - flag 0x000200
          if (flags & 0x000200) sampleOffset += 4;
          // sample-flags (4 bytes) - flag 0x000400
          if (flags & 0x000400) sampleOffset += 4;
          // sample-composition-time-offset (4 bytes) - flag 0x000800
          if (flags & 0x000800) sampleOffset += 4;
          
          totalDuration += sampleDuration;
        }
        
        const trackEndTime = baseTime + totalDuration;
        if (trackEndTime > maxEndTime) {
          maxEndTime = trackEndTime;
        }
      }
    }
    
    offset += size;
  }
  
  return maxEndTime;
}

// 修正 MP4 时长
function fixMp4Duration(mp4Data) {
  const data = new Uint8Array(mp4Data);
  const totalSize = data.length;
  
  // 找到 moov box
  const moov = findBox(data, 0, totalSize, 'moov');
  if (!moov) {
    log('未找到 moov box，跳过时长修正', 'warn');
    return mp4Data;
  }
  
  // 找到 mvhd
  const mvhd = findBox(data, moov.offset + moov.headerSize, moov.offset + moov.size, 'mvhd');
  if (!mvhd) {
    log('未找到 mvhd box，跳过时长修正', 'warn');
    return mp4Data;
  }
  
  const mvhdDataOffset = mvhd.offset + mvhd.headerSize;
  const version = data[mvhdDataOffset];
  
  let timescale, duration;
  if (version === 1) {
    timescale = readUint32(data, mvhdDataOffset + 20);
    duration = readUint64(data, mvhdDataOffset + 24);
  } else {
    timescale = readUint32(data, mvhdDataOffset + 12);
    duration = readUint32(data, mvhdDataOffset + 16);
  }
  
  log(`原始时长: ${(duration / timescale).toFixed(2)} 秒 (timescale: ${timescale})`, 'info');
  
  // 遍历所有 moof 片段，计算真实总时长
  let maxDuration = 0;
  let offset = moov.offset + moov.size; // 从 moov 后面开始找
  
  let fragmentCount = 0;
  while (offset < totalSize) {
    if (offset + 8 > totalSize) break;
    let size = readUint32(data, offset);
    const type = String.fromCharCode(data[offset + 4], data[offset + 5], data[offset + 6], data[offset + 7]);
    
    if (size <= 0 || size > totalSize - offset) break;
    
    if (type === 'moof') {
      const fragDuration = getFragmentDuration(data, offset, offset + size, timescale);
      if (fragDuration > maxDuration) {
        maxDuration = fragDuration;
      }
      fragmentCount++;
    }
    
    offset += size;
  }
  
  log(`扫描到 ${fragmentCount} 个媒体片段，计算真实时长: ${(maxDuration / timescale).toFixed(2)} 秒`, 'info');
  
  // 如果计算出的时长和原始时长差异很大，就修正
  if (maxDuration > 0 && Math.abs(maxDuration - duration) > timescale) {
    // 修正 mvhd 中的 duration
    if (version === 1) {
      writeUint64(data, mvhdDataOffset + 24, maxDuration);
    } else {
      writeUint32(data, mvhdDataOffset + 16, maxDuration);
    }
    
    // 同时修正每个 trak 中的 duration
    let trakOffset = moov.offset + moov.headerSize;
    while (trakOffset < moov.offset + moov.size) {
      if (trakOffset + 8 > moov.offset + moov.size) break;
      let trakSize = readUint32(data, trakOffset);
      const trakType = String.fromCharCode(data[trakOffset + 4], data[trakOffset + 5], data[trakOffset + 6], data[trakOffset + 7]);
      
      if (trakType === 'trak' && trakSize > 0) {
        const tkhd = findBox(data, trakOffset + 8, trakOffset + trakSize, 'tkhd');
        if (tkhd) {
          const tkhdDataOffset = tkhd.offset + tkhd.headerSize;
          const tkhdVersion = data[tkhdDataOffset];
          if (tkhdVersion === 1) {
            writeUint64(data, tkhdDataOffset + 24, maxDuration);
          } else {
            writeUint32(data, tkhdDataOffset + 16, maxDuration);
          }
        }
        
        // 修正 mdhd
        const mdia = findBox(data, trakOffset + 8, trakOffset + trakSize, 'mdia');
        if (mdia) {
          const mdhd = findBox(data, mdia.offset + mdia.headerSize, trakOffset + trakSize, 'mdhd');
          if (mdhd) {
            const mdhdDataOffset = mdhd.offset + mdhd.headerSize;
            const mdhdVersion = data[mdhdDataOffset];
            if (mdhdVersion === 1) {
              // 每个轨道可能有不同的 timescale，但这里我们用 track 自己的 timescale 来换算
              // 先读取 timescale
              const trackTimescale = readUint32(data, mdhdDataOffset + 20);
              const scaledDuration = Math.floor(maxDuration * trackTimescale / timescale);
              writeUint64(data, mdhdDataOffset + 24, scaledDuration);
            } else {
              const trackTimescale = readUint32(data, mdhdDataOffset + 12);
              const scaledDuration = Math.floor(maxDuration * trackTimescale / timescale);
              writeUint32(data, mdhdDataOffset + 16, scaledDuration);
            }
          }
        }
      }
      
      if (trakSize <= 0) break;
      trakOffset += trakSize;
    }
    
    log(`✓ 已修正 MP4 时长为 ${(maxDuration / timescale).toFixed(2)} 秒`, 'success');
  } else {
    log('时长正常，无需修正', 'info');
  }
  
  return data.buffer;
}

// ========== TS -> MP4 转换 ==========

function transmuxTStoMP4(tsData) {
  return new Promise((resolve, reject) => {
    try {
      // 不使用 keepOriginalTimestamps，让 mux.js 从 0 开始归一化时间戳
      const transmuxer = new muxjs.mp4.Transmuxer();
      
      let initSegment = null;
      const mediaSegments = [];
      
      transmuxer.on('data', (segment) => {
        if (segment.initSegment && !initSegment) {
          initSegment = segment.initSegment;
          log(`✓ 已获取 MP4 初始化片段 (${formatSize(initSegment.byteLength)})`, 'info');
        }
        if (segment.data && segment.data.byteLength > 0) {
          mediaSegments.push(segment.data);
        }
      });
      
      transmuxer.on('done', () => {
        if (!initSegment) {
          reject(new Error('未生成 MP4 初始化片段，视频格式可能不支持'));
          return;
        }
        
        let totalLength = initSegment.byteLength;
        for (const seg of mediaSegments) {
          totalLength += seg.byteLength;
        }
        
        const mp4Data = new Uint8Array(totalLength);
        let offset = 0;
        
        mp4Data.set(new Uint8Array(initSegment), offset);
        offset += initSegment.byteLength;
        
        for (const seg of mediaSegments) {
          mp4Data.set(new Uint8Array(seg), offset);
          offset += seg.byteLength;
        }
        
        log(`✓ MP4 封装完成，共 ${mediaSegments.length} 个媒体片段`, 'success');
        
        // 修正时长
        log('正在校正视频时长...', 'info');
        const fixedMp4 = fixMp4Duration(mp4Data.buffer);
        resolve(new Uint8Array(fixedMp4));
      });
      
      transmuxer.on('error', (err) => {
        reject(new Error('转换错误: ' + (err.type || err.message || '未知错误')));
      });
      
      transmuxer.push(tsData);
      transmuxer.flush();
      
    } catch (err) {
      reject(err);
    }
  });
}

// ========== 主流程 ==========

async function startConvert() {
  if (isConverting) return;
  
  const url = urlInput.value.trim();
  
  if (!url && segments.length === 0) {
    log('请输入 m3u8 链接或上传 m3u8 文件', 'warn');
    return;
  }
  
  isConverting = true;
  startBtn.disabled = true;
  statusCard.classList.add('active');
  clearBtn.classList.add('show');
  logArea.innerHTML = '';
  downloadedSegments = [];
  totalSize = 0;
  
  if (mp4Url) {
    URL.revokeObjectURL(mp4Url);
    mp4Url = null;
  }
  mp4Blob = null;
  downloadBtn.classList.remove('show');
  previewSection.classList.remove('show');
  
  if (url) {
    setStatus('正在获取 m3u8 播放列表...');
    log('正在获取 m3u8 播放列表...');
    startTimer();
    
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const content = await response.text();
      segments = parseM3U8(content, url);
      
      if (segments.length === 0) {
        throw new Error('未找到视频分段地址');
      }
      
      log(`解析成功，共 ${segments.length} 个分段`, 'success');
    } catch (err) {
      log('获取 m3u8 失败: ' + err.message, 'error');
      log('可能原因：1) 链接无效 2) 服务器不支持跨域(CORS) 3) 网络问题', 'warn');
      setStatus('获取失败');
      isConverting = false;
      startBtn.disabled = false;
      stopTimer();
      return;
    }
  }
  
  segmentCountEl.textContent = `0 / ${segments.length}`;
  
  setStatus('正在下载分段...');
  log('开始下载视频分段...');
  
  const concurrency = 5;
  let index = 0;
  let completed = 0;
  
  async function downloadWorker() {
    while (index < segments.length) {
      const currentIndex = index++;
      const segUrl = segments[currentIndex];
      
      try {
        const response = await fetch(segUrl);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const buffer = await response.arrayBuffer();
        const data = new Uint8Array(buffer);
        
        downloadedSegments[currentIndex] = data;
        totalSize += data.length;
        
        completed++;
        const percent = (completed / segments.length) * 100;
        updateProgress(percent);
        segmentCountEl.textContent = `${completed} / ${segments.length}`;
        downloadedSizeEl.textContent = formatSize(totalSize);
        
        if (completed % 10 === 0 || completed === segments.length) {
          log(`✓ 已下载 ${completed}/${segments.length} 个分段 (${formatSize(totalSize)})`, 'info');
        }
      } catch (err) {
        log(`✗ 分段 ${currentIndex + 1} 下载失败: ${err.message}`, 'error');
        downloadedSegments[currentIndex] = null;
      }
    }
  }
  
  const workers = [];
  for (let i = 0; i < Math.min(concurrency, segments.length); i++) {
    workers.push(downloadWorker());
  }
  await Promise.all(workers);
  
  const failedCount = downloadedSegments.filter(s => s === null).length;
  if (failedCount > 0) {
    log(`${failedCount} 个分段下载失败，转换可能不完整`, 'warn');
  }
  
  setStatus('正在转换为 MP4...');
  log('正在合并 TS 数据并转换为 MP4 格式...');
  
  try {
    const validSegments = downloadedSegments.filter(s => s !== null);
    const totalLength = validSegments.reduce((sum, s) => sum + s.length, 0);
    const combined = new Uint8Array(totalLength);
    let offset = 0;
    for (const seg of validSegments) {
      combined.set(seg, offset);
      offset += seg.length;
    }
    
    log(`TS 数据合并完成，总大小 ${formatSize(totalLength)}`, 'info');
    
    const mp4Data = await transmuxTStoMP4(combined);
    
    mp4Blob = new Blob([mp4Data], { type: 'video/mp4' });
    mp4Url = URL.createObjectURL(mp4Blob);
    
    updateProgress(100);
    setStatus('转换完成！');
    log(`转换完成！MP4 文件大小: ${formatSize(mp4Blob.size)}`, 'success');
    
    previewVideo.src = mp4Url;
    previewSection.classList.add('show');
    videoSize.textContent = formatSize(mp4Blob.size);
    
    previewVideo.onloadedmetadata = () => {
      const dur = previewVideo.duration;
      const mins = Math.floor(dur / 60);
      const secs = Math.floor(dur % 60);
      videoDuration.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
      videoResolution.textContent = `${previewVideo.videoWidth} × ${previewVideo.videoHeight}`;
      log(`视频信息: ${previewVideo.videoWidth}×${previewVideo.videoHeight}, 时长 ${mins}:${secs.toString().padStart(2, '0')}`, 'success');
    };
    
    downloadBtn.classList.add('show');
    stopTimer();
    isConverting = false;
    startBtn.disabled = false;
    
  } catch (err) {
    log('转换失败: ' + err.message, 'error');
    log('可能原因：视频编码格式不支持（仅支持 H.264/H.265 + AAC）', 'warn');
    setStatus('转换失败');
    stopTimer();
    isConverting = false;
    startBtn.disabled = false;
  }
}

function downloadMp4() {
  if (!mp4Blob) return;
  
  const a = document.createElement('a');
  a.href = mp4Url;
  a.download = 'video_' + Date.now() + '.mp4';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  
  log('MP4 文件已开始下载', 'success');
}

function clearAll() {
  segments = [];
  downloadedSegments = [];
  totalSize = 0;
  mp4Blob = null;
  isConverting = false;
  
  if (mp4Url) {
    URL.revokeObjectURL(mp4Url);
    mp4Url = null;
  }
  
  urlInput.value = '';
  fileInput.value = '';
  logArea.innerHTML = '';
  updateProgress(0);
  setStatus('等待中');
  segmentCountEl.textContent = '0 / 0';
  downloadedSizeEl.textContent = '0 MB';
  elapsedTimeEl.textContent = '00:00';
  
  statusCard.classList.remove('active');
  downloadBtn.classList.remove('show');
  clearBtn.classList.remove('show');
  previewSection.classList.remove('show');
  previewVideo.src = '';
  startBtn.disabled = false;
  stopTimer();
}

urlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') startConvert();
});
</script>
